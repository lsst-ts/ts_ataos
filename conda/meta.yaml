{% set data= load_setup_py_data() %}
package:
  name: ts-ataos
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  entry_points:
    - run_ataos_csc = lsst.ts.ataos.ataos_csc:run_ataos_csc
  string: "py{{ PY_VER | replace('.', '') }}{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"

test:
  requires:
    - ts-conda-build =0.5
    - astroquery
    - ts-xml {{ xml_version }}
    - ts-salobj {{ salobj_version }}
    - ts-observatory-control
  source_files:
    - python
    - bin
    - tests
    - pyproject.toml
  commands:
    - pytest

requirements:
  host:
    - python {{ python }}
    - pip
    - setuptools_scm ={{setuptools_scm}}
    - setuptools >={{setuptools}}
  run:
    - python {{ python }}
    - setuptools
    - setuptools_scm
    - astroquery
    - ts-salobj
    - ts-xml
    - ts-observatory-control
